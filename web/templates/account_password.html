<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>비밀번호 변경 · Paper Server</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fa;color:#192840;margin:0;padding:8vh 20px}
main{max-width:400px;margin:auto;padding:30px;background:white;border:1px solid #dce2eb;border-radius:14px}
h1{font-size:24px}label{display:block;margin-top:18px}input{box-sizing:border-box;width:100%;padding:11px;margin-top:7px;border:1px solid #bbc7d6;border-radius:7px}
button{width:100%;margin:24px 0 18px;padding:12px;background:#244fba;color:white;border:0;border-radius:7px;font-size:15px}.error{color:#a52222}a{color:#244fba}
</style></head>
<body><main><h1>비밀번호 변경</h1><p>{{ username }} · 8자 이상, 계정명 제외</p>
{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>현재 비밀번호<input type="password" name="current_password" autocomplete="current-password" required maxlength="256"></label>
<label>새 비밀번호<input type="password" name="new_password" autocomplete="new-password" required minlength="8" maxlength="256"></label>
<label>새 비밀번호 확인<input type="password" name="confirmation" autocomplete="new-password" required minlength="8" maxlength="256"></label>
<button type="submit">비밀번호 저장</button></form><a href="/">논문 목록으로</a></main></body></html>
